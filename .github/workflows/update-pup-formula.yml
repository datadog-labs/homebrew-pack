name: Update pup formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "pup version to update to, without the leading v. Defaults to the latest release."
        required: false
        type: string

concurrency:
  group: update-pup-formula
  cancel-in-progress: false

env:
  PUP_REPOSITORY: DataDog/pup
  FORMULA_FILE: Formula/pup.rb

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint GitHub token
        id: octo-sts
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: ${{ github.repository }}
          policy: self.github.update-pup-formula.workflow-dispatch

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: true

      - name: Resolve pup release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          requested_version="${REQUESTED_VERSION#v}"
          if [[ -n "$requested_version" ]]; then
            tag="v${requested_version}"
          else
            tag="$(gh release view --repo "$PUP_REPOSITORY" --json tagName --jq .tagName)"
          fi

          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported pup release version: $version" >&2
            exit 1
          fi

          current_version="$(grep -m 1 'releases/download/v' "$FORMULA_FILE" | sed -E 's|.*releases/download/v([^/]+)/.*|\1|')"
          if [[ -z "$current_version" ]]; then
            echo "Could not determine current version from $FORMULA_FILE URLs" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "current_version=$current_version"
          } >> "$GITHUB_OUTPUT"

          if [[ "$version" == "$current_version" ]]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "$FORMULA_FILE is already at pup v${version}."
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release checksums
        if: steps.release.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUP_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$PUP_TAG" \
            --repo "$PUP_REPOSITORY" \
            --pattern '*checksums.txt' \
            --output checksums.txt \
            --clobber

      - name: Update formula
        if: steps.release.outputs.needs_update == 'true'
        env:
          PUP_VERSION: ${{ steps.release.outputs.version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          formula_file = pathlib.Path(os.environ["FORMULA_FILE"])
          checksums_file = pathlib.Path("checksums.txt")
          version = os.environ["PUP_VERSION"]
          repository = os.environ["PUP_REPOSITORY"]

          suffixes = (
              "Darwin_arm64",
              "Darwin_x86_64",
              "Linux_arm64",
              "Linux_x86_64",
          )
          expected_assets = {
              suffix: f"pup_{version}_{suffix}.tar.gz"
              for suffix in suffixes
          }

          parsed_checksums = {}
          for raw_line in checksums_file.read_text().splitlines():
              parts = raw_line.split()
              if len(parts) < 2:
                  continue
              checksum = parts[0]
              filename = pathlib.PurePosixPath(parts[-1]).name
              for suffix, asset_name in expected_assets.items():
                  if filename == asset_name:
                      if not re.fullmatch(r"[a-fA-F0-9]{64}", checksum):
                          print(f"Invalid checksum for {asset_name}: {checksum}", file=sys.stderr)
                          sys.exit(1)
                      parsed_checksums[suffix] = checksum.lower()

          missing_assets = [
              asset_name
              for suffix, asset_name in expected_assets.items()
              if suffix not in parsed_checksums
          ]
          if missing_assets:
              print("Missing checksums for: " + ", ".join(missing_assets), file=sys.stderr)
              sys.exit(1)

          lines = formula_file.read_text().splitlines(keepends=True)
          assets_updated = set()

          for index, line in enumerate(lines):
              asset_match = re.search(
                  r'pup_[^"]+_(Darwin_arm64|Darwin_x86_64|Linux_arm64|Linux_x86_64)\.tar\.gz',
                  line,
              )
              if not asset_match:
                  continue

              suffix = asset_match.group(1)
              new_url = (
                  f"https://github.com/{repository}/releases/download/"
                  f"v{version}/pup_{version}_{suffix}.tar.gz"
              )
              lines[index] = re.sub(r'https://github\.com/[^"]+', new_url, line)

              checksum_index = index + 1
              if checksum_index >= len(lines) or "sha256" not in lines[checksum_index]:
                  print(f"Could not find sha256 line after {expected_assets[suffix]}", file=sys.stderr)
                  sys.exit(1)

              indent = re.match(r"\s*", lines[checksum_index]).group(0)
              lines[checksum_index] = f'{indent}sha256 "{parsed_checksums[suffix]}"\n'
              assets_updated.add(suffix)

          missing_updates = sorted(set(suffixes) - assets_updated)
          if missing_updates:
              print("Did not update assets for: " + ", ".join(missing_updates), file=sys.stderr)
              sys.exit(1)

          formula_file.write_text("".join(lines))
          PY

      - name: Validate formula changes
        if: steps.release.outputs.needs_update == 'true'
        env:
          PUP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ruby -c "$FORMULA_FILE"
          git diff --check "$FORMULA_FILE"

          # Homebrew infers the version from the URL, and its heuristic picks up
          # the "64" in "arm64"/"x86_64" when the /vX.Y.Z/ path segment is
          # missing, producing kegs versioned "64" that can never be upgraded.
          url_count="$(grep -c "/v${PUP_VERSION}/pup_${PUP_VERSION}_" "$FORMULA_FILE" || true)"
          if [[ "$url_count" -ne 4 ]]; then
            echo "Expected 4 versioned release URLs in $FORMULA_FILE, found ${url_count}." >&2
            exit 1
          fi

          if grep -q '^[[:space:]]*version "' "$FORMULA_FILE"; then
            echo "$FORMULA_FILE declares an explicit version, which brew audit --strict rejects as redundant." >&2
            exit 1
          fi

      - name: Stage formula changes
        id: stage
        if: steps.release.outputs.needs_update == 'true'
        env:
          PUP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if git diff --quiet -- "$FORMULA_FILE"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No formula changes to publish."
            exit 0
          fi

          branch="update/pup-${PUP_VERSION}"
          git add "$FORMULA_FILE"

          # commit-headless commits through the GitHub API, so it needs to be
          # told whether to create the branch. Either way the staged change is
          # applied on top of the branch point, so an existing branch is
          # force-updated rather than accumulating a commit per re-dispatch.
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" > /dev/null; then
            create_branch=false
            force=true
          else
            create_branch=true
            force=false
          fi

          {
            echo "has_changes=true"
            echo "branch=$branch"
            echo "create_branch=$create_branch"
            echo "force=$force"
          } >> "$GITHUB_OUTPUT"

      - name: Push signed commit
        if: steps.stage.outputs.has_changes == 'true'
        uses: DataDog/commit-headless@d6afabfd690ea1dbdd7d368acbefd71304928699 # action/v3.4.1
        with:
          command: commit
          token: ${{ steps.octo-sts.outputs.token }}
          branch: ${{ steps.stage.outputs.branch }}
          create-branch: ${{ steps.stage.outputs.create_branch }}
          force: ${{ steps.stage.outputs.force }}
          head-sha: ${{ github.sha }}
          message: Update pup to v${{ steps.release.outputs.version }}

      - name: Create or update pull request
        if: steps.stage.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PUP_VERSION: ${{ steps.release.outputs.version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.stage.outputs.branch }}
        run: |
          set -euo pipefail

          branch="$BRANCH"
          title="Update pup to v${PUP_VERSION}"

          pr_body="$(mktemp)"
          cat > "$pr_body" <<EOF
          ## What does this PR do?

          Updates the \`pup\` Homebrew formula from v${CURRENT_VERSION} to v${PUP_VERSION} using release assets from \`${PUP_REPOSITORY}\`.

          ## Motivation

          Keeps the Homebrew tap in sync with the latest \`pup\` release so users can install the current version through Homebrew.

          ## Testing

          - [ ] Tested formula installation: \`brew install --build-from-source ./Formula/pup.rb\`
          - [ ] Ran formula tests: \`brew test pup\`
          - [ ] Ran audit: \`brew audit --strict pup\`
          - [ ] Verified on macOS version: <!-- e.g., macOS 14.x -->
          - [x] Verified formula syntax with \`ruby -c Formula/pup.rb\`
          - [x] Verified the workflow replaced all release asset checksums from \`${PUP_REPOSITORY}\`

          ## Checklist

          - [x] The formula follows [Homebrew's Formula Cookbook](https://docs.brew.sh/Formula-Cookbook)
          - [x] SHA256 checksums are included and verified
          - [x] All dependencies are documented
          - [x] The formula includes a meaningful test block
          - [x] Changes are documented in commit messages
          - [ ] Related issues are linked (if applicable)

          ## Additional Notes

          Generated by the \`Update pup formula\` workflow.
          EOF

          pr_number="$(gh pr list \
            --head "$branch" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$title" --body-file "$pr_body"
            echo "Updated PR #${pr_number}."
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$title" --body-file "$pr_body"
          fi